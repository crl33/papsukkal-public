<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:title" content="Papsukkal" />
    <meta property="og:description" content="A living wildflower photograph. Coming soon." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#06121f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2306121f'/%3E%3Cg fill='%23c2258f'%3E%3Cellipse cx='16' cy='9' rx='3.4' ry='5'/%3E%3Cellipse cx='16' cy='23' rx='3.4' ry='5'/%3E%3Cellipse cx='9' cy='16' rx='5' ry='3.4'/%3E%3Cellipse cx='23' cy='16' rx='5' ry='3.4'/%3E%3Cellipse cx='11' cy='11' rx='3.8' ry='3.2' transform='rotate(-45 11 11)'/%3E%3Cellipse cx='21' cy='11' rx='3.8' ry='3.2' transform='rotate(45 21 11)'/%3E%3Cellipse cx='11' cy='21' rx='3.8' ry='3.2' transform='rotate(45 11 21)'/%3E%3Cellipse cx='21' cy='21' rx='3.8' ry='3.2' transform='rotate(-45 21 21)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='4' fill='%23111c3a'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%23e8b820' stroke-width='1.3'/%3E%3C/svg%3E"
    />
    <title>Papsukkal</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #06121f;
        font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(1.5rem, 4vw, 3.5rem);
        pointer-events: none;
        color: #eaf4f4;
      }
      header.brand h1 {
        font-size: clamp(1.05rem, 1.6vw, 1.45rem);
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        text-shadow: 0 1px 18px rgba(4, 16, 26, 0.9), 0 0 2px rgba(4, 16, 26, 0.8);
        opacity: 0;
        animation: rise 1.8s cubic-bezier(0.2, 0.6, 0.2, 1) 0.4s forwards;
      }
      footer.foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(214, 233, 235, 0.78);
        text-shadow: 0 1px 12px rgba(4, 16, 26, 0.9);
        opacity: 0;
        animation: rise 1.8s cubic-bezier(0.2, 0.6, 0.2, 1) 0.9s forwards;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        header.brand h1,
        footer.foot {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene" role="img" aria-label="A wildflower meadow photograph, alive with a gentle breeze: magenta cosmos, daisies and poppies swaying softly."></div>
    <div class="overlay">
      <header class="brand">
        <h1>Papsukkal</h1>
      </header>
      <footer class="foot">
        <span>Coming soon</span>
        <span aria-hidden="true">MMXXVI</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Papsukkal" />
    <meta name="theme-color" content="#06121f" />
    <title>Papsukkal</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #06121f;
        font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ---- landing overlay: quiet typography, the meadow is the page ---- */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(1.5rem, 4vw, 3.5rem);
        pointer-events: none;
        color: #eaf4f4;
      }
      .overlay a,
      .overlay h1 {
        pointer-events: auto;
      }
      header.brand h1 {
        font-size: clamp(1.05rem, 1.6vw, 1.45rem);
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        text-shadow: 0 1px 18px rgba(4, 16, 26, 0.9), 0 0 2px rgba(4, 16, 26, 0.8);
        opacity: 0;
        animation: rise 1.8s cubic-bezier(0.2, 0.6, 0.2, 1) 0.4s forwards;
      }
      footer.foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(214, 233, 235, 0.78);
        text-shadow: 0 1px 12px rgba(4, 16, 26, 0.9);
        opacity: 0;
        animation: rise 1.8s cubic-bezier(0.2, 0.6, 0.2, 1) 0.9s forwards;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        header.brand h1,
        footer.foot {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene" role="img" aria-label="A living wildflower meadow: magenta cosmos, daisies and poppies swaying in a gentle breeze, photographed with a shallow depth of field."></div>
    <div class="overlay">
      <header class="brand">
        <h1>Papsukkal</h1>
      </header>
      <footer class="foot">
        <span>Coming soon</span>
        <span aria-hidden="true">MMXXVI</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
